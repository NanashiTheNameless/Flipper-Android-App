syntax = "proto3";

option java_package = "dev.namelessnanashi.flipperzero.core.preference.pb";
option java_multiple_files = true;

enum HardwareColor {
  WHITE = 0;
  BLACK = 1;
  TRANSPARENT = 2;
}

message PairSettings {
  reserved 1;
  reserved "tos_passed";
  bool pair_device_pass = 2;
  string device_id = 3;
  string device_name = 4;
  HardwareColor hardware_color = 5;
}