name: Nightly

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: Signed nightly release
    runs-on: ubuntu-latest
    env:
      BUILD_TOOLS: "37.0.0"
      APK_DIR: instances/android/app/build/outputs/apk/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Variables
        id: vars
        run: |
          set -euo pipefail
          sha7=$(git rev-parse --short=7 HEAD)
          date=$(date -u +%Y.%m.%d)
          {
            echo "sha7=$sha7"
            echo "date=$date"
            echo "apk=Flipper-Nanashi-nightly-$date-$sha7.apk"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version-file: .java-version

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The default also installs the obsolete 'tools' package, which no longer exists
          packages: platform-tools

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;${BUILD_TOOLS}" "ndk;29.0.14206865" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE secret is not set. Official builds must be signed."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Verify certificate parser
        run: bash scripts/test_apk_certificate.sh

      - name: Unit tests
        run: ./build.sh testDebugUnitTest testAndroidHostTest --no-daemon --build-cache

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./build.sh :instances:android:app:assembleRelease --no-daemon --build-cache -PversionSuffix=${{ steps.vars.outputs.sha7 }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify V3 signing certificate
        id: cert
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          src=$(ls "$APK_DIR"/*.apk | grep -v unsigned | head -n 1 || true)
          if [ -z "$src" ]; then
            echo "::error::No signed release APK was produced. Check the RELEASE_* secrets."
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$apksigner" -J-enable-native-access=ALL-UNNAMED verify --min-sdk-version 26 "$src"
          actual=$("$apksigner" -J-enable-native-access=ALL-UNNAMED verify --verbose --min-sdk-version 26 --print-certs "$src" \
            | bash scripts/apk_certificate_sha256.sh)
          expected=$(printf '%s' "$EXPECTED" | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::error::Repository variable RELEASE_CERT_SHA256 is not set. This build is signed by $actual. Set the variable to that value if it is your key."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed by $actual, expected $expected. Refusing to publish."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp "$src" "$RUNNER_TEMP/out/${{ steps.vars.outputs.apk }}"
          cp "$src" "$RUNNER_TEMP/out/Flipper-Nanashi-nightly.apk"
          cp docs/Flipper-Nanashi-obtainium.json "$RUNNER_TEMP/out/Flipper-Nanashi-obtainium.json"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          apk_sum=$(sha256sum "$out/${{ steps.vars.outputs.apk }}" | cut -d' ' -f1)
          cat > "$out/notes.md" <<EOF
          > [!WARNING]
          > Unofficial, modified, personal fork of the Flipper Zero Android app. Not affiliated with Flipper Devices. Unstable. Not meant for adoption by anyone but Nanashi.

          Nightly build of \`${GITHUB_SHA}\` from ${{ steps.vars.outputs.date }}.

          <table>
          <tr><td>APK</td><td><code>${{ steps.vars.outputs.apk }}</code> (also <code>Flipper-Nanashi-nightly.apk</code>)</td></tr>
          <tr><td>APK SHA-256</td><td><code>${apk_sum}</code></td></tr>
          <tr><td>Signing certificate SHA-256</td><td><code>${{ steps.cert.outputs.sha256 }}</code></td></tr>
          </table>
          EOF

      - name: Move Nightly-Rolling tag
        run: |
          set -euo pipefail
          git tag -f Nightly-Rolling "$GITHUB_SHA"
          git push -f origin refs/tags/Nightly-Rolling

      - name: Publish Nightly-Rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          title="Nightly-Rolling ${{ steps.vars.outputs.date }} (${{ steps.vars.outputs.sha7 }})"
          if gh release view Nightly-Rolling > /dev/null 2>&1; then
            gh release edit Nightly-Rolling --title "$title" --notes-file "$out/notes.md" --prerelease=false --latest
          else
            gh release create Nightly-Rolling --title "$title" --notes-file "$out/notes.md" --latest --verify-tag
          fi
          gh release upload Nightly-Rolling --clobber \
            "$out/${{ steps.vars.outputs.apk }}" \
            "$out/Flipper-Nanashi-nightly.apk" \
            "$out/Flipper-Nanashi-obtainium.json"

      - name: Prune old nightly APKs
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_APKS: "5"
        run: |
          set -euo pipefail
          gh release view Nightly-Rolling --json assets \
            --jq '.assets | map(select(.name | test("^Flipper-Nanashi-nightly-.*\\.apk$"))) | sort_by(.createdAt) | reverse | .[((env.PREVIOUS_APKS | tonumber) + 1):] | .[].name' \
            | while read -r name; do
                [ -n "$name" ] && gh release delete-asset Nightly-Rolling "$name" --yes
              done
