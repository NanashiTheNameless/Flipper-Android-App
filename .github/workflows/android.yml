name: Android CI

# Pushes to dev are built, tested, and published by nightly.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version-file: .java-version

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The default also installs the obsolete 'tools' package, which no longer exists
          packages: platform-tools

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify certificate parser
        run: bash scripts/test_apk_certificate.sh

      - name: Unit tests
        run: ./build.sh testDebugUnitTest testAndroidHostTest --no-daemon --build-cache --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./build.sh :instances:android:app:assembleDebug --no-daemon --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flipper-nanashi-debug-apk
          path: instances/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
